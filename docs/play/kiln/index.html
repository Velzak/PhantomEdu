<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Kiln</title>
  <style>
    html, body { margin: 0; height: 100%; background: #120c16; color: #f3e8ff; font-family: system-ui, sans-serif; overflow: hidden; }
    canvas { display: block; margin: 0 auto; background: #1a1022; }
    #hud { position: absolute; left: 16px; top: 12px; }
    #overlay { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; text-align: center; }
    button { background: #6c5ce7; color: #fff; border: 0; padding: 10px 18px; border-radius: 8px; cursor: pointer; }
    p { opacity: 0.8; }
  </style>
</head>
<body>
  <div id="hud">Lives 3 · Bricks 0</div>
  <div id="overlay">
    <div>
      <h1>Kiln</h1>
      <p>Clear the kiln wall. Miss the ember and you lose a life.<br/>Move with arrows, A/D, or the pointer.</p>
      <button id="start">Play</button>
    </div>
  </div>
  <canvas id="c"></canvas>
  <script>
    const canvas = document.getElementById("c");
    const ctx = canvas.getContext("2d");
    const overlay = document.getElementById("overlay");
    const hud = document.getElementById("hud");
    let W, H, paddle, ball, bricks, lives, running, keys = {};

    const colors = ["#6c5ce7", "#8b5cf6", "#2dd4bf", "#f59e0b", "#f26d6d"];

    function size() {
      W = Math.min(window.innerWidth, 720);
      H = Math.min(window.innerHeight, 540);
      canvas.width = W; canvas.height = H;
    }
    function makeBricks() {
      bricks = [];
      const cols = 9, rows = 5, bw = (W - 40) / cols, bh = 18;
      for (let r = 0; r < rows; r++) {
        for (let c = 0; c < cols; c++) {
          bricks.push({ x: 20 + c * bw, y: 50 + r * (bh + 8), w: bw - 6, h: bh, color: colors[r], live: true });
        }
      }
    }
    function serve() {
      paddle = { x: W / 2 - 50, y: H - 28, w: 100, h: 12 };
      ball = { x: W / 2, y: H - 50, r: 7, vx: 4 * (Math.random() < 0.5 ? 1 : -1), vy: -5 };
    }
    function startGame() {
      lives = 3;
      makeBricks();
      serve();
      running = true;
      overlay.style.display = "none";
      requestAnimationFrame(loop);
    }
    function remaining() { return bricks.filter((b) => b.live).length; }
    function finish(title, body) {
      running = false;
      overlay.style.display = "flex";
      overlay.querySelector("h1").textContent = title;
      overlay.querySelector("p").textContent = body;
      document.getElementById("start").textContent = "Play again";
    }
    function step() {
      if (keys.left) paddle.x -= 8;
      if (keys.right) paddle.x += 8;
      paddle.x = Math.max(0, Math.min(W - paddle.w, paddle.x));
      ball.x += ball.vx; ball.y += ball.vy;
      if (ball.x < ball.r || ball.x > W - ball.r) ball.vx *= -1;
      if (ball.y < ball.r) ball.vy *= -1;
      if (ball.y + ball.r >= paddle.y && ball.x > paddle.x && ball.x < paddle.x + paddle.w && ball.vy > 0) {
        const hit = (ball.x - (paddle.x + paddle.w / 2)) / (paddle.w / 2);
        ball.vx = hit * 6;
        ball.vy = -Math.abs(ball.vy);
      }
      bricks.forEach((b) => {
        if (!b.live) return;
        if (ball.x > b.x && ball.x < b.x + b.w && ball.y > b.y && ball.y < b.y + b.h) {
          b.live = false;
          ball.vy *= -1;
        }
      });
      if (remaining() === 0) finish("Kiln cleared", "Every brick is gone.");
      if (ball.y > H) {
        lives--;
        if (lives <= 0) finish("The ember dropped", "No lives left.");
        else serve();
      }
      hud.textContent = "Lives " + lives + " · Bricks " + remaining();
    }
    function draw() {
      ctx.fillStyle = "#1a1022";
      ctx.fillRect(0, 0, W, H);
      bricks.forEach((b) => {
        if (!b.live) return;
        ctx.fillStyle = b.color;
        ctx.fillRect(b.x, b.y, b.w, b.h);
      });
      ctx.fillStyle = "#e7e9ee";
      ctx.fillRect(paddle.x, paddle.y, paddle.w, paddle.h);
      ctx.fillStyle = "#fbbf24";
      ctx.beginPath(); ctx.arc(ball.x, ball.y, ball.r, 0, Math.PI * 2); ctx.fill();
    }
    function loop() {
      if (!running) return;
      step(); draw();
      requestAnimationFrame(loop);
    }
    document.getElementById("start").onclick = startGame;
    window.addEventListener("keydown", (e) => {
      if (["ArrowLeft", "a"].includes(e.key)) { keys.left = true; e.preventDefault(); }
      if (["ArrowRight", "d"].includes(e.key)) { keys.right = true; e.preventDefault(); }
    });
    window.addEventListener("keyup", (e) => {
      if (["ArrowLeft", "a"].includes(e.key)) keys.left = false;
      if (["ArrowRight", "d"].includes(e.key)) keys.right = false;
    });
    canvas.addEventListener("mousemove", (e) => {
      const r = canvas.getBoundingClientRect();
      paddle.x = ((e.clientX - r.left) / r.width) * W - paddle.w / 2;
    });
    canvas.addEventListener("touchmove", (e) => {
      const t = e.touches[0];
      const r = canvas.getBoundingClientRect();
      paddle.x = ((t.clientX - r.left) / r.width) * W - paddle.w / 2;
      e.preventDefault();
    }, { passive: false });
    window.addEventListener("resize", size);
    size();
    paddle = { x: 200, y: 400, w: 100, h: 12 };
    ball = { x: 220, y: 300, r: 7 };
    bricks = [];
    draw();
  </script>
</body>
</html>
