<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Ribbon</title>
  <style>
    html, body { margin: 0; height: 100%; background: #0c1220; color: #e8edf7; font-family: system-ui, sans-serif; }
    canvas { display: block; margin: 0 auto; background: #10182a; }
    #hud { position: absolute; left: 16px; top: 12px; font-size: 14px; letter-spacing: 0.04em; }
    #overlay { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; text-align: center; }
    h1 { font-weight: 650; margin: 0 0 8px; }
    p { opacity: 0.75; margin: 0 0 16px; }
    button { background: #6c5ce7; color: white; border: 0; padding: 10px 18px; border-radius: 8px; font-size: 15px; cursor: pointer; }
  </style>
</head>
<body>
  <div id="hud">Score 0</div>
  <div id="overlay">
    <div>
      <h1>Ribbon</h1>
      <p>Eat the glints. Walls and your own tail end the run.<br/>Arrows or WASD.</p>
      <button id="start">Play</button>
    </div>
  </div>
  <canvas id="c"></canvas>
  <script>
    const canvas = document.getElementById("c");
    const ctx = canvas.getContext("2d");
    const hud = document.getElementById("hud");
    const overlay = document.getElementById("overlay");
    const cell = 20;
    let cols, rows, snake, dir, pending, food, score, alive, acc, last;

    function resize() {
      const w = Math.min(window.innerWidth, 720);
      const h = Math.min(window.innerHeight, 520);
      cols = Math.floor(w / cell);
      rows = Math.floor(h / cell);
      canvas.width = cols * cell;
      canvas.height = rows * cell;
    }
    function spawnFood() {
      do {
        food = { x: Math.floor(Math.random() * cols), y: Math.floor(Math.random() * rows) };
      } while (snake.some((s) => s.x === food.x && s.y === food.y));
    }
    function reset() {
      snake = [{ x: Math.floor(cols / 2), y: Math.floor(rows / 2) }];
      dir = { x: 1, y: 0 };
      pending = dir;
      score = 0;
      alive = true;
      acc = 0;
      hud.textContent = "Score 0";
      spawnFood();
    }
    function draw() {
      ctx.fillStyle = "#10182a";
      ctx.fillRect(0, 0, canvas.width, canvas.height);
      ctx.fillStyle = "#2dd4bf";
      ctx.beginPath();
      ctx.arc(food.x * cell + cell / 2, food.y * cell + cell / 2, cell * 0.32, 0, Math.PI * 2);
      ctx.fill();
      snake.forEach((s, i) => {
        ctx.fillStyle = i === 0 ? "#c4b5fd" : "#6c5ce7";
        ctx.fillRect(s.x * cell + 1, s.y * cell + 1, cell - 2, cell - 2);
      });
    }
    function tick() {
      dir = pending;
      const head = { x: snake[0].x + dir.x, y: snake[0].y + dir.y };
      if (head.x < 0 || head.y < 0 || head.x >= cols || head.y >= rows || snake.some((s) => s.x === head.x && s.y === head.y)) {
        alive = false;
        overlay.style.display = "flex";
        overlay.querySelector("h1").textContent = "Run over";
        overlay.querySelector("p").innerHTML = "Score " + score + ".<br/>Play again?";
        document.getElementById("start").textContent = "Play again";
        return;
      }
      snake.unshift(head);
      if (head.x === food.x && head.y === food.y) {
        score += 10;
        hud.textContent = "Score " + score;
        spawnFood();
      } else snake.pop();
    }
    function loop(t) {
      if (!alive) return;
      const dt = t - last;
      last = t;
      acc += dt;
      const step = Math.max(70, 140 - score);
      while (acc > step) { acc -= step; tick(); }
      draw();
      requestAnimationFrame(loop);
    }
    function start() {
      overlay.style.display = "none";
      reset();
      last = performance.now();
      requestAnimationFrame(loop);
    }
    window.addEventListener("keydown", (e) => {
      const map = {
        ArrowUp: { x: 0, y: -1 }, ArrowDown: { x: 0, y: 1 }, ArrowLeft: { x: -1, y: 0 }, ArrowRight: { x: 1, y: 0 },
        w: { x: 0, y: -1 }, s: { x: 0, y: 1 }, a: { x: -1, y: 0 }, d: { x: 1, y: 0 }
      };
      const next = map[e.key];
      if (!next) return;
      e.preventDefault();
      if (next.x + dir.x === 0 && next.y + dir.y === 0) return;
      pending = next;
    });
    document.getElementById("start").onclick = start;
    window.addEventListener("resize", resize);
    resize();
    draw();
  </script>
</body>
</html>
