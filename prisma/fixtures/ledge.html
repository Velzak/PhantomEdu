<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Ledge</title>
  <style>
    html, body { margin: 0; height: 100%; background: #0b1320; color: #e7e9ee; font-family: system-ui, sans-serif; overflow: hidden; }
    canvas { display: block; margin: 0 auto; background: #152036; }
    #overlay { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; text-align: center; }
    button { background: #6c5ce7; color: #fff; border: 0; padding: 10px 18px; border-radius: 8px; cursor: pointer; }
    p { opacity: 0.8; }
  </style>
</head>
<body>
  <div id="overlay">
    <div>
      <h1>Ledge</h1>
      <p>Reach the beacon. Gaps drop you. Jump the crates.<br/>Arrows / WASD to move, Space or Up to jump.</p>
      <button id="start">Play</button>
    </div>
  </div>
  <canvas id="c"></canvas>
  <script>
    const canvas = document.getElementById("c");
    const ctx = canvas.getContext("2d");
    const overlay = document.getElementById("overlay");
    const keys = {};
    let W, H, p, running;

    const solids = [
      { x: 0, y: 420, w: 220, h: 80 },
      { x: 280, y: 420, w: 120, h: 80 },
      { x: 460, y: 360, w: 110, h: 140 },
      { x: 620, y: 300, w: 180, h: 200 },
      { x: 360, y: 250, w: 70, h: 18 },
    ];
    const crates = [
      { x: 500, y: 328, w: 28, h: 32 },
      { x: 660, y: 268, w: 28, h: 32 },
    ];
    const goal = { x: 750, y: 248, w: 18, h: 52 };

    function size() {
      W = 800; H = 500;
      canvas.width = W; canvas.height = H;
    }
    function spawn() {
      p = { x: 40, y: 360, w: 22, h: 34, vx: 0, vy: 0, on: false };
    }
    function rects(a, b) {
      return a.x < b.x + b.w && a.x + a.w > b.x && a.y < b.y + b.h && a.y + a.h > b.y;
    }
    function finish(title, body) {
      running = false;
      overlay.style.display = "flex";
      overlay.querySelector("h1").textContent = title;
      overlay.querySelector("p").textContent = body;
      document.getElementById("start").textContent = "Play again";
    }
    function step() {
      const left = keys.ArrowLeft || keys.a;
      const right = keys.ArrowRight || keys.d;
      p.vx = (right ? 3.4 : 0) - (left ? 3.4 : 0);
      if ((keys.ArrowUp || keys.w || keys[" "]) && p.on) p.vy = -10.2;
      p.vy += 0.45;
      p.x += p.vx;
      solids.concat(crates).forEach((s) => {
        if (!rects(p, s)) return;
        if (p.vx > 0) p.x = s.x - p.w;
        else if (p.vx < 0) p.x = s.x + s.w;
      });
      p.y += p.vy;
      p.on = false;
      solids.concat(crates).forEach((s) => {
        if (!rects(p, s)) return;
        if (p.vy > 0) { p.y = s.y - p.h; p.vy = 0; p.on = true; }
        else if (p.vy < 0) { p.y = s.y + s.h; p.vy = 0; }
      });
      if (p.y > H) finish("Off the ledge", "You dropped. Try a cleaner jump.");
      if (rects(p, goal)) finish("Beacon reached", "You crossed the gaps.");
    }
    function draw() {
      const g = ctx.createLinearGradient(0, 0, 0, H);
      g.addColorStop(0, "#1c2a44");
      g.addColorStop(1, "#0f1728");
      ctx.fillStyle = g;
      ctx.fillRect(0, 0, W, H);
      ctx.fillStyle = "#243049";
      solids.forEach((s) => ctx.fillRect(s.x, s.y, s.w, s.h));
      ctx.fillStyle = "#6c5ce7";
      crates.forEach((s) => ctx.fillRect(s.x, s.y, s.w, s.h));
      ctx.fillStyle = "#2dd4bf";
      ctx.fillRect(goal.x, goal.y, goal.w, goal.h);
      ctx.fillStyle = "#f8fafc";
      ctx.fillRect(p.x, p.y, p.w, p.h);
    }
    function loop() {
      if (!running) return;
      step(); draw();
      requestAnimationFrame(loop);
    }
    document.getElementById("start").onclick = () => {
      overlay.style.display = "none";
      spawn();
      running = true;
      requestAnimationFrame(loop);
    };
    window.addEventListener("keydown", (e) => { keys[e.key] = true; if (["ArrowUp","ArrowDown","ArrowLeft","ArrowRight"," "].includes(e.key)) e.preventDefault(); });
    window.addEventListener("keyup", (e) => { keys[e.key] = false; });
    size();
    spawn();
    draw();
  </script>
</body>
</html>
