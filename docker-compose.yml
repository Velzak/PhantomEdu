services:
  app:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: file:/data/db.sqlite
      GAMES_STORAGE_PATH: /data/games
      THUMBNAILS_STORAGE_PATH: /data/uploads/thumbnails
      NEXTAUTH_URL: ${NEXTAUTH_URL:-http://localhost:3000}
    volumes:
      - game-data:/data
    ports:
      - "3000:3000"

  caddy:
    image: caddy:2
    restart: unless-stopped
    depends_on:
      - app
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    profiles:
      - tls

volumes:
  game-data:
  caddy-data:
  caddy-config:
